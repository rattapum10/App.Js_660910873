<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Log - บันทึกการออกกำลังกาย</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🏋️‍♂️ Workout Log</h1>

    <!-- ฟอร์มเพิ่มรายการ -->
    <section class="card">
      <h2>เพิ่มรายการออกกำลังกาย</h2>
      <form id="add-form">
        <input type="text" id="title" placeholder="ชื่อกิจกรรม (เช่น ตีแบดมินตัน)" required>
        <select id="category" required>
          <option value="">-- เลือกประเภท --</option>
          <option value="badminton">แบดมินตัน (Badminton)</option>
          <option value="cardio">คาร์ดิโอ (Cardio)</option>
          <option value="weight">เวทเทรนนิ่ง (Weight Training)</option>
        </select>
        <input type="number" id="duration" placeholder="ระยะเวลา (นาที)" required>
        <input type="date" id="date">
        <button type="submit">บันทึกรายการ</button>
      </form>
    </section>

    <!-- ตัวกรอง (Filter Query String) -->
    <section class="filter-section">
      <label for="filter-category"><strong>กรองตามประเภท:</strong> </label>
      <select id="filter-category" onchange="fetchWorkouts()">
        <option value="">ทั้งหมด</option>
        <option value="badminton">แบดมินตัน</option>
        <option value="cardio">คาร์ดิโอ</option>
        <option value="weight">เวทเทรนนิ่ง</option>
      </select>
    </section>

    <!-- แสดงรายการ -->
    <section class="card">
      <h2>รายการทั้งหมด</h2>
      <ul id="workout-list"></ul>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
